description: This dandiset contains whole-cell patch-clamp recordings and confocal
  fluorescence images from the supramammillary nucleus (SuM) in acute mouse brain
  slices. Whole-cell recordings were made from fluorescently identified SuM neurons
  (including SuM cells projecting to the hippocampus) and comprise both current-clamp
  firing-property measurements and voltage-clamp light-evoked synaptic responses under
  optogenetic stimulation. Confocal z-stacks (Nikon A1Rsi, 60× oil objective, DAPI
  and EGFP) were acquired to quantify hippocampal SypEGFP+ synaptic terminals (puncta)
  across ipsilateral, medial, and contralateral SuM. Electrophysiology and imaging
  are provided as NWB files (one per recording session / image); the complete source
  spreadsheets are included verbatim under sourcedata/. Data span 11 mice (male and
  female, >P45).
